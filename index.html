<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="search-container">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-button">Search</button>
        </div>
        <div id="searched-weather-container">
            <!-- Weather for searched locations will be added here -->
        </div>
        <div class="weather-info">
            <h3>Current Weather</h3> <!-- Added a heading for clarity -->
            <div class="current-weather-main">
                <img id="current-weather-icon" src="" alt="Weather icon" style="display:none;"> <!-- Icon placeholder -->
                <p class="current-temp">Temperature: <span id="temperature">--</span>°C</p>
            </div>
            <p id="current-weather-description">Condition: --</p>
            <p>Feels Like: <span id="current-feels-like">--</span>°C</p> <!-- New -->
            <p>Wind Speed: <span id="wind-speed">--</span> m/s</p>
            <p>Humidity: <span id="humidity">--</span>%</p>
            <p>Sunrise: <span id="current-sunrise">--</span></p> <!-- New -->
            <p>Sunset: <span id="current-sunset">--</span></p> <!-- New -->
        </div>
        <div id="forecast-container">
            <h2>5-Day Forecast</h2>
            <div class="forecast-days">
                <!-- Forecast for individual days will be injected here by JavaScript -->
                <!-- Example structure for one day (to be generated by JS):
                <div class="forecast-day">
                    <p class="forecast-date">YYYY-MM-DD</p>
                    <p class="forecast-temp">Min: X°C / Max: Y°C</p>
                    <p class="forecast-condition">Condition</p>
                    // Icon will go here later
                </div>
                -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
